name: Sanitized bug report
description: Report a reproducible problem using synthetic or redacted data only.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not paste cookies, tokens, pairing codes, private URLs, database rows, logs with personal paths, or real listening history.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I verified that this report and its attachments contain no credentials, private URLs, database content, or personal listening data.
          required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Use synthetic names and values where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS version, Node.js version, and affected platform; do not include usernames or paths.
